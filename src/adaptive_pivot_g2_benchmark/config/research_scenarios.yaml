# Fixed start-goal pairs for same-input Nav2 smoother experiments.
# Coordinates are in the research_warehouse map frame.  Optional third values
# are yaw angles in radians; if omitted, the direct start-to-goal bearing is used.
environment: research_warehouse
scenarios:
  - name: straight_lower_aisle
    start: [-2.5, -3.0]
    goal: [4.8, -3.0]
  - name: crate_detour
    start: [-5.0, -1.8]
    goal: [-2.0, -1.8]
  - name: vertical_rack_detour
    start: [-2.5, 2.8]
    goal: [0.5, 2.8]
  - name: horizontal_rack_detour
    start: [0.0, -2.8]
    goal: [4.8, -0.2]
  - name: right_rack_detour
    start: [3.2, 0.0]
    goal: [5.2, 3.2]
  - name: long_southwest_to_northeast
    start: [-5.0, -3.0]
    goal: [5.0, 3.0]
  - name: long_northeast_to_southwest
    start: [5.0, 3.0]
    goal: [-5.0, -3.0]
  - name: crossing_northwest_to_southeast
    start: [-5.0, 3.0]
    goal: [5.0, -3.0]
  - name: central_south_to_north
    start: [-2.0, -3.0]
    goal: [0.2, 3.2]
  - name: right_south_to_north
    start: [5.0, -3.0]
    goal: [3.2, 3.2]
  - name: upper_open_short
    start: [-5.0, 3.2]
    goal: [-2.2, 3.2]
  - name: lower_left_diagonal
    start: [-5.0, -3.0]
    goal: [-2.0, -0.5]
