amcl:
  ros__parameters:
    # Gazebo's wheel odometry was calibrated against ground truth (<0.1%
    # error in the straight/turn regression).  TurtleBot-style 0.2 motion
    # noise makes the particle cloud wander unrealistically in this simulation.
    # Keep a small non-zero model uncertainty for the simulated sensor run;
    # the physical robot will use a separately calibrated localization file.
    alpha1: 0.005
    alpha2: 0.005
    alpha3: 0.005
    alpha4: 0.005
    alpha5: 0.005
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 1.50
    laser_max_range: -1.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 180
    max_particles: 3000
    min_particles: 1000
    odom_frame_id: "odom"
    pf_err: 0.03
    pf_z: 0.99
    random_seed: 42
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.15
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.02
    update_min_d: 0.02
    # likelihood_field uses z_hit and z_rand; keep their mixture normalized.
    z_hit: 0.65
    z_max: 0.0
    z_rand: 0.35
    z_short: 0.0
    scan_topic: scan
    set_initial_pose: true
    always_reset_initial_pose: true
    initial_pose:
      x: -5.0
      y: -3.0
      z: 0.0
      yaw: 0.0

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    # Progress checker parameters
    progress_checker:
      # Differential-drive pivots make angular progress without translating.
      # PoseProgressChecker accepts either 5 cm translation or 0.05 rad
      # rotation, while retaining the timeout for a genuinely stuck robot.
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.05
      required_movement_angle: 0.05
      movement_time_allowance: 30.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      # Completion is a physical state, not only a pose event.  Re-check XY
      # while turning and require both wheel-derived velocities to be stopped.
      # Latch XY after it is first satisfied while final yaw is aligned.
      # Ground-truth acceptance below still rejects a physically wrong pose;
      # this only prevents AMCL scan corrections from repeatedly reopening XY.
      stateful: True
      plugin: "nav2_controller::StoppedGoalChecker"
      # Keep the estimated-pose tolerance below the 0.10 m physical benchmark
      # tolerance by a margin that covers the measured 0.05--0.065 m AMCL
      # position error in Gazebo.
      xy_goal_tolerance: 0.03
      # Remain just outside the controller's 0.025 rad settled band so the
      # terminal yaw servo, rather than a loose goal check, decides completion.
      yaw_goal_tolerance: 0.03
      trans_stopped_velocity: 0.01
      rot_stopped_velocity: 0.02
    # One deterministic controller is shared by every smoothing method.
    FollowPath:
      # Same RPP law is used for every method.  The wrapper additionally
      # executes duplicate-position / heading-change markers as explicit
      # stop-and-rotate maneuvers instead of silently skipping Pivot-G2 pivots.
      plugin: "adaptive_pivot_g2_controller::ManeuverAwareRPPController"
      # Upper bound only: the wrapper continuously computes a lower safe speed
      # from future curvature, S-curve braking, wheel limits and RPP safety.
      desired_linear_vel: 0.30
      lookahead_dist: 0.35
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.60
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.60
      transform_tolerance: 0.20
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.025
      approach_velocity_scaling_dist: 0.40
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.35
      regulated_linear_scaling_min_speed: 0.025
      cost_scaling_dist: 0.30
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 5.0
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.35
      max_angular_accel: 1.20
      allow_reversing: false
      pivot_duplicate_position_tolerance: 0.0001
      minimum_pivot_angle: 0.0872664626
      # Switch from predictive braking to the bidirectional precision servo at
      # this distance from an interior pivot marker.
      pivot_position_tolerance: 0.10
      # Leave 0.015 rad internal deadband so AMCL yaw updates still fit inside
      # the 0.03 rad global goal-checker tolerance.
      pivot_yaw_tolerance: 0.015
      pivot_stopped_linear_velocity: 0.01
      pivot_stopped_angular_velocity: 0.02
      pivot_max_angular_speed: 0.70
      pivot_max_angular_acceleration: 1.20
      # Ground-truth trace in the four-contact Gazebo model decelerated at
      # ~0.18 rad/s² while reversing an initial alignment. This conservative
      # physical-response value feeds a sqrt(2*alpha*remaining_yaw) braking
      # envelope so the base does not overshoot and counter-rotate.
      pivot_effective_angular_deceleration: 0.18
      pivot_heading_gain: 1.8
      pivot_control_period: 0.05
      # The map-aware spawn yaw is only a pre-planning estimate. Once the
      # selected path exists, stop and align to its 0.30 m preview chord if
      # the mismatch exceeds 0.15 rad; release with 0.035 rad hysteresis.
      initial_alignment_preview_distance: 0.30
      initial_alignment_enter_angle: 0.15
      initial_alignment_exit_angle: 0.035
      # Latch a low-speed terminal pose servo before localization error can
      # let RPP pass the endpoint.  It holds XY, then aligns final yaw.
      terminal_position_tolerance: 0.15
      # Remain inside StoppedGoalChecker's 0.03 m estimated-pose radius while
      # avoiding noisy bearing control on millimetre-scale residual vectors.
      terminal_hold_position_tolerance: 0.025
      # The position controller aims 5 mm inside the hold threshold, avoiding
      # an asymptotic equilibrium exactly on the state-transition boundary.
      terminal_hold_entry_margin: 0.005
      # If AMCL drifts while final yaw is being aligned, leave the yaw phase
      # and reacquire XY before StoppedGoalChecker is allowed to complete.
      terminal_release_position_tolerance: 0.04
      # Stop from cruise at this staging radius. Only after the base is
      # physically stopped does the bidirectional precision servo enter.
      terminal_staging_position_tolerance: 0.15
      terminal_stop_margin: 0.03
      # Gazebo end-to-end cmd_vel -> base response measured from the failed
      # trials is ~0.08 m/s^2 near completion despite higher component limits.
      terminal_effective_deceleration: 0.08
      # The pose servo may enter at cruise speed; the S-curve braking envelope
      # reduces it continuously instead of imposing a 0.12 m/s step.
      terminal_max_linear_speed: 0.30
      terminal_precision_max_linear_speed: 0.05
      terminal_position_gain: 2.5
      terminal_realign_heading_tolerance: 0.05
      # Predictive Constraint Envelope (PCE): path-space backward braking plus
      # online RPP/cost, lateral, angular and differential-wheel constraints.
      adaptive_speed_enabled: true
      adaptive_max_linear_speed: 0.30
      adaptive_max_angular_speed: 0.80
      adaptive_max_wheel_linear_speed: 0.36
      adaptive_wheel_separation: 0.2548
      adaptive_max_lateral_acceleration: 0.18
      adaptive_max_linear_acceleration: 0.35
      adaptive_max_linear_deceleration: 0.45
      adaptive_max_angular_acceleration: 1.20
      adaptive_max_linear_jerk: 0.90
      adaptive_curvature_sample_distance: 0.10
      adaptive_terminal_linear_speed: 0.0
      # Stop inside the goal-checker region before FollowPath can
      # complete and remove a still-moving command.
      adaptive_terminal_stop_buffer: 0.05
      adaptive_projection_search_backward: 0.25
      adaptive_projection_search_forward: 0.80
      # Heading-aware, progress-monotone projection prevents selecting the
      # wrong branch where a path passes close to itself.
      adaptive_projection_heading_weight: 0.20
      adaptive_projection_max_regression: 0.03
      adaptive_feedback_sync_tolerance: 0.06
      # Closed-loop recovery envelope: speed is only released after lateral,
      # heading and measured-yaw-response errors settle after a curve.
      adaptive_cross_track_error_soft: 0.02
      adaptive_cross_track_error_hard: 0.10
      adaptive_heading_error_soft: 0.08
      adaptive_heading_error_hard: 0.45
      adaptive_angular_tracking_error_soft: 0.08
      adaptive_angular_tracking_error_hard: 0.35
      adaptive_recovery_min_linear_speed: 0.06
      adaptive_speed_diagnostics_topic: "/research/adaptive_speed"

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      # Environment switching restarts Gazebo and its TF bridge. Give the new
      # odom->base_link stream time to appear before lifecycle activation.
      initial_transform_timeout: 10.0
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[[0.22, 0.17], [0.22, -0.17], [-0.22, -0.17], [-0.22, 0.17]]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.45
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      initial_transform_timeout: 10.0
      footprint: "[[0.22, 0.17], [0.22, -0.17], [-0.22, -0.17], [-0.22, 0.17]]"
      resolution: 0.05
      track_unknown_space: true
      # The publication map is static. Keep the global planner input identical
      # across fresh runs; 1 cm lidar noise in a redundant global obstacle
      # layer otherwise changes the Theta* path hash between algorithms. The
      # local costmap and collision monitor still use live lidar for safety.
      plugins: ["static_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.45
      always_send_full_costmap: True

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
# map_server:
#   ros__parameters:
#     yaml_filename: ""

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    # Planner quality and smoother quality are reported as two separate
    # factors. Within one planner/scenario pair every smoother receives the
    # exact same raw nav_msgs/Path.
    planner_plugins:
      - "NavFnAStar"
      - "NavFnDijkstra"
      - "ThetaStar"
      - "Smac2D"
      - "SmacHybrid"
    costmap_update_timeout: 1.0
    NavFnAStar:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.10
      use_astar: true
      allow_unknown: false
    NavFnDijkstra:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.10
      use_astar: false
      allow_unknown: false
    ThetaStar:
      plugin: "nav2_theta_star_planner::ThetaStarPlanner"
      how_many_corners: 8
      w_euc_cost: 1.0
      w_traversal_cost: 2.0
      use_final_approach_orientation: false
      allow_unknown: false
    Smac2D:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.10
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      terminal_checking_interval: 5000
      max_planning_time: 3.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      # Smac2D includes its own light search-output smoother and does not expose
      # a disable switch in Jazzy. Treat that native post-processing as part of
      # the planner when comparing raw outputs.
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2
    # Curvature-constrained baseline. The physical platform can pivot, while
    # this forward-only Dubins search cannot; results must therefore be
    # labelled as a different motion-model assumption, not an equal drivetrain
    # model. Internal smoothing is disabled so all post-processors still start
    # from the planner's raw output.
    SmacHybrid:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      tolerance: 0.10
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      terminal_checking_interval: 5000
      max_planning_time: 3.0
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 1.5
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false
      minimum_turning_radius: 0.35
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 8.0
      cache_obstacle_heuristic: false
      allow_primitive_interpolation: true
      smooth_path: false

smoother_server:
  ros__parameters:
    costmap_topic: global_costmap/costmap_raw
    footprint_topic: global_costmap/published_footprint
    robot_base_frame: base_link
    smoother_plugins: ["simple_smoother", "savitzky_golay", "constrained", "pivot_g2_fixed", "pivot_g2", "adaptive_hybrid_fixed", "adaptive_hybrid"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True
      refinement_num: 2
      enforce_path_inversion: false
    savitzky_golay:
      plugin: "nav2_smoother::SavitzkyGolaySmoother"
      do_refinement: true
      refinement_num: 2
      enforce_path_inversion: false
    constrained:
      plugin: "nav2_constrained_smoother/ConstrainedSmoother"
      reversing_enabled: false
      # Keep every planner sample. A factor of 2 can alias an A-B-A NavFn
      # oscillation into consecutive A-A optimization variables, producing a
      # non-finite curvature residual in Ceres.
      path_downsampling_factor: 1
      path_upsampling_factor: 1
      keep_start_orientation: true
      keep_goal_orientation: true
      minimum_turning_radius: 0.0
      w_curve: 0.0
      w_dist: 0.0
      w_smooth: 200000.0
      w_cost: 0.015
      optimizer:
        max_iterations: 70
        debug_optimizer: false
    pivot_g2_fixed:
      plugin: "adaptive_pivot_g2_nav2/AdaptivePivotG2Smoother"
      radius_search_mode: fixed
      radius_candidates: [0.20, 0.30, 0.40, 0.50, 0.60, 0.75, 1.00, 1.25, 1.50]
      delta_time_selection: 0.15
      time_competitive_slack: 10.0
      clearance_weight: 0.15
      angular_speed_weight: 0.10
      curvature_energy_weight: 0.75
      max_footprint_cost: 252
      corner_angle_threshold: 0.0872664626
      # Collapse planner-grid staircase noise only inside a 1.5-cell corridor;
      # every shortcut is swept-footprint checked before it is accepted.
      path_conditioning_max_deviation: 0.0
      path_conditioning_resolution_ratio: 1.5
      oscillation_maximum_span: 2.0
      oscillation_maximum_deviation: 0.0
      oscillation_deviation_resolution_ratio: 3.0
      oscillation_minimum_turn_angle: 0.20
      oscillation_minimum_sign_changes: 2
      line_of_sight_pruning: false
      output_spacing: 0.05
      sample_spacing: 0.02
      bezier_control_fraction: 0.35
      max_trim_fraction: 0.45
      wheel_separation: 0.2548
      max_linear_speed: 0.30
      max_angular_speed: 0.80
      max_wheel_speed: 0.36
      max_lateral_acceleration: 0.18
      max_linear_acceleration: 0.35
      max_linear_deceleration: 0.45
      max_angular_acceleration: 1.20
      fallback_footprint_length: 0.44
      fallback_footprint_width: 0.34
    pivot_g2:
      plugin: "adaptive_pivot_g2_nav2/AdaptivePivotG2Smoother"
      radius_search_mode: adaptive
      radius_candidates: [0.20, 0.30, 0.40, 0.50, 0.60, 0.75, 1.00, 1.25, 1.50]
      minimum_radius: 0.10
      maximum_physical_radius: 1.50
      initial_search_samples: 6
      maximum_evaluations_per_corner: 20
      radius_tolerance: 0.01
      objective_tolerance: 0.01
      # Zero selects max(output_spacing, 2*sample_spacing, costmap resolution).
      segment_margin: 0.0
      retained_candidates_per_corner: 5
      # Scale for integral(kappa^2 ds), whose unit is 1/m.
      curvature_energy_scale: 1.0
      delta_time_selection: 0.15
      time_competitive_slack: 10.0
      clearance_weight: 0.15
      angular_speed_weight: 0.10
      curvature_energy_weight: 0.75
      # Inflation-cost gate at the robot center. The full swept footprint is
      # checked separately against lethal cells, avoiding double inflation.
      max_footprint_cost: 252
      corner_angle_threshold: 0.0872664626
      path_conditioning_max_deviation: 0.0
      path_conditioning_resolution_ratio: 1.5
      oscillation_maximum_span: 2.0
      oscillation_maximum_deviation: 0.0
      oscillation_deviation_resolution_ratio: 3.0
      oscillation_minimum_turn_angle: 0.20
      oscillation_minimum_sign_changes: 2
      # Disabled in the primary benchmark.  Applying LOS only inside Pivot-G2
      # would change its input path while the baselines keep the raw path and
      # would confound pruning gains with smoothing gains.  Keep the feature in
      # the plugin for a separately labelled Pivot-G2+LOS ablation.
      line_of_sight_pruning: false
      output_spacing: 0.05
      sample_spacing: 0.02
      bezier_control_fraction: 0.35
      max_trim_fraction: 0.45
      # CAD rolling-tread center distance; calibrate on the physical robot.
      wheel_separation: 0.2548
      max_linear_speed: 0.30
      max_angular_speed: 0.80
      max_wheel_speed: 0.36
      max_lateral_acceleration: 0.18
      max_linear_acceleration: 0.35
      max_linear_deceleration: 0.45
      max_angular_acceleration: 1.20
      fallback_footprint_length: 0.44
      fallback_footprint_width: 0.34
    adaptive_hybrid_fixed:
      plugin: "adaptive_pivot_g2_nav2/SafetyGatedHybridSmoother"
      peak_cost_deadband: 20.0
      relative_effort_deadband: 0.05
      effort_floor: 0.25
      path_length_tolerance: 1.0e-6
      pivot_rotation_characteristic_length: 0.2548
      maximum_center_cost: 252
      evaluation_spacing: 0.025
      pivot_duplicate_position_tolerance: 0.0001
      minimum_pivot_angle: 0.0872664626
      simple:
        tolerance: 1.0e-10
        max_its: 1000
        do_refinement: True
        refinement_num: 2
        enforce_path_inversion: false
      pivot:
        radius_search_mode: fixed
        radius_candidates: [0.20, 0.30, 0.40, 0.50, 0.60, 0.75, 1.00, 1.25, 1.50]
        delta_time_selection: 0.15
        time_competitive_slack: 10.0
        clearance_weight: 0.15
        angular_speed_weight: 0.10
        curvature_energy_weight: 0.75
        max_footprint_cost: 252
        corner_angle_threshold: 0.0872664626
        path_conditioning_max_deviation: 0.0
        path_conditioning_resolution_ratio: 1.5
        oscillation_maximum_span: 2.0
        oscillation_maximum_deviation: 0.0
        oscillation_deviation_resolution_ratio: 3.0
        oscillation_minimum_turn_angle: 0.20
        oscillation_minimum_sign_changes: 2
        line_of_sight_pruning: false
        output_spacing: 0.05
        sample_spacing: 0.02
        bezier_control_fraction: 0.35
        max_trim_fraction: 0.45
        wheel_separation: 0.2548
        max_linear_speed: 0.30
        max_angular_speed: 0.80
        max_wheel_speed: 0.36
        max_lateral_acceleration: 0.18
        max_linear_acceleration: 0.35
        max_linear_deceleration: 0.45
        max_angular_acceleration: 1.20
        fallback_footprint_length: 0.44
        fallback_footprint_width: 0.34
      fallback_footprint_length: 0.44
      fallback_footprint_width: 0.34
    adaptive_hybrid:
      plugin: "adaptive_pivot_g2_nav2/SafetyGatedHybridSmoother"
      # Symmetric lexicographic policy: either candidate wins a >=20 peak-cost
      # advantage. Inside that deadband, compare full maneuver effort with a
      # 5% relative deadband; effort includes in-place rotation for both paths.
      peak_cost_deadband: 20.0
      relative_effort_deadband: 0.05
      effort_floor: 0.25
      path_length_tolerance: 1.0e-6
      pivot_rotation_characteristic_length: 0.2548
      maximum_center_cost: 252
      evaluation_spacing: 0.025
      pivot_duplicate_position_tolerance: 0.0001
      minimum_pivot_angle: 0.0872664626
      simple:
        tolerance: 1.0e-10
        max_its: 1000
        do_refinement: True
        refinement_num: 2
        enforce_path_inversion: false
      pivot:
        radius_search_mode: adaptive
        radius_candidates: [0.20, 0.30, 0.40, 0.50, 0.60, 0.75, 1.00, 1.25, 1.50]
        minimum_radius: 0.10
        maximum_physical_radius: 1.50
        initial_search_samples: 6
        maximum_evaluations_per_corner: 20
        radius_tolerance: 0.01
        objective_tolerance: 0.01
        segment_margin: 0.0
        retained_candidates_per_corner: 5
        curvature_energy_scale: 1.0
        delta_time_selection: 0.15
        time_competitive_slack: 10.0
        clearance_weight: 0.15
        angular_speed_weight: 0.10
        curvature_energy_weight: 0.75
        max_footprint_cost: 252
        corner_angle_threshold: 0.0872664626
        path_conditioning_max_deviation: 0.0
        path_conditioning_resolution_ratio: 1.5
        oscillation_maximum_span: 2.0
        oscillation_maximum_deviation: 0.0
        oscillation_deviation_resolution_ratio: 3.0
        oscillation_minimum_turn_angle: 0.20
        oscillation_minimum_sign_changes: 2
        line_of_sight_pruning: false
        output_spacing: 0.05
        sample_spacing: 0.02
        bezier_control_fraction: 0.35
        max_trim_fraction: 0.45
        wheel_separation: 0.2548
        max_linear_speed: 0.30
        max_angular_speed: 0.80
        max_wheel_speed: 0.36
        max_lateral_acceleration: 0.18
        max_linear_acceleration: 0.35
        max_linear_deceleration: 0.45
        max_angular_acceleration: 1.20
        fallback_footprint_length: 0.44
        fallback_footprint_width: 0.34
      fallback_footprint_length: 0.44
      fallback_footprint_width: 0.34

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.70
    min_rotational_vel: 0.10
    rotational_acc_lim: 1.20

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

route_server:
  ros__parameters:
    # The graph_filepath does not need to be specified since it going to be set by defaults in launch.
    # If you'd rather set it in the yaml, remove the default "graph" value in the launch file(s).
    # file & provide full path to map below. If graph config or launch default is provided, it is used
    # graph_filepath: $(find-pkg-share nav2_route)/graphs/aws_graph.geojson
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations: ["AdjustSpeedLimit", "ReroutingService", "CollisionMonitor"]
    ReroutingService:
      plugin: "nav2_route::ReroutingService"
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
    CollisionMonitor:
      plugin: "nav2_route::CollisionMonitor"
      max_collision_dist: 3.0
    edge_cost_functions: ["DistanceScorer", "CostmapScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    CostmapScorer:
      plugin: "nav2_route::CostmapScorer"

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 50.0
    stamp_smoothed_velocity_with_smoothing_time: False
    scale_velocities: False
    feedback: "CLOSED_LOOP"
    max_velocity: [0.30, 0.0, 0.80]
    min_velocity: [-0.30, 0.0, -0.80]
    max_accel: [0.35, 0.0, 1.20]
    max_decel: [-0.45, 0.0, -1.20]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    # At 20 Hz controller rate this tolerates two missed cycles, but prevents
    # the base from replaying a stale non-zero command for a full second after
    # FollowPath succeeds or aborts.
    velocity_timeout: 0.15

collision_monitor:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Polygons represent zone around the robot for "stop", "slowdown" and "limit" action types,
    # and robot footprint for "approach" action type.
    # Predictive full-footprint guard. This is enabled again for the centred
    # two-wheel differential model; its scan frame no longer produces the
    # false collision seen on the former four-wheel approximation.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.5
      simulation_time_step: 0.05
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: True

docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    # Types of docks
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false # true
      use_stall_detection: false # true

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    # Dock instances
    # The following example illustrates configuring dock instances.
    # docks: ['home_dock']  # Input your docks here
    # home_dock:
    #   type: 'simple_charging_dock'
    #   frame: map
    #   pose: [0.0, 0.0, 0.0]

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3

loopback_simulator:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    map_frame_id: "map"
    scan_frame_id: "base_scan"  # tb4_loopback_simulator.launch.py remaps to 'rplidar_link'
    update_duration: 0.02
    scan_range_min: 0.05
    scan_range_max: 30.0
    scan_angle_min: -3.1415
    scan_angle_max: 3.1415
    scan_angle_increment: 0.02617
    scan_use_inf: true
